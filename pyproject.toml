[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bulgarian-driving-exam-database"
version = "0.1.0"
description = "Extraction, validation and publication tooling for the Bulgarian driving licence theory exam question bank."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "slaviboy" }]
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pydantic>=2.10,<3",
    "pillow>=11",
    "rich>=13",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.9",
    "pdfplumber>=0.11",
]

[project.scripts]
qb = "question_bank.cli:main"

[project.urls]
Repository = "https://github.com/slaviboy/bulgarian-driving-exam-database"

[tool.setuptools.packages.find]
include = ["question_bank*"]

[tool.setuptools.package-data]
question_bank = ["database/schema/*.sql", "database/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs internet access to the official source (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic look-alike letters are intentional in this domain
