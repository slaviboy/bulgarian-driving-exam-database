name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: |
          ruff check question_bank tests
          ruff format --check question_bank tests
      - name: Unit and integration tests (offline)
        run: pytest -q
      - name: JSON Schemas are generated from the models
        run: |
          qb schemas
          git diff --exit-code contract/schemas
